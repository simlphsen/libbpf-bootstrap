name: libbpf-bootstrap android build

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '7 17 * * *'

jobs:
  build_libbpf_bootstrap_android:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [armeabi-v7a, arm64-v8a, x86_64]
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    # 1. 缓存 Xmake 下载和构建的第三方依赖包 (~/.xmake/packages)
    - name: Cache Xmake Packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.xmake/packages
          ~/.xmake/cache
        key: xmake-${{ runner.os }}-${{ matrix.arch }}-${{ hashFiles('**/xmake.lua') }}
        restore-keys: |
          xmake-${{ runner.os }}-${{ matrix.arch }}-

    # 2. 配置并管理 ccache 编译缓存
    - name: Setup Ccache
      uses: hendrikmuhs/ccache-action@v1.2
      with:
        key: ccache-${{ runner.os }}-${{ matrix.arch }}
        # GitHub 默认单项 Cache 限制 10GB，ccache 建议分配 2GB~5GB
        max-size: 2G

    - name: Install System Dependencies
      run: |
        sudo apt-get update -y
        sudo apt-get install -yqq --no-install-recommends \
          build-essential clang llvm zlib1g-dev libc++-dev libc++abi-dev ccache

    - name: Setup Xmake
      uses: xmake-io/github-action-setup-xmake@v1
      with:
        xmake-version: branch@master

    # 3. 开启 ccache 支持并构建
    - name: Build xmake android examples/c
      run: |
        cd examples/c
        # 通过 --ccache=y 参数开启 ccache 加速
        xmake f -p android -a ${{ matrix.arch }} --require-bpftool=y --ccache=y -y --ndk=$ANDROID_NDK_LATEST_HOME
        xmake -y

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: libbpf-bootstrap-${{ matrix.arch }}
        path: examples/c/build/
        retention-days: 30
